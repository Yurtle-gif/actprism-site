name = "flockkitty-rooms"
main = "worker.js"
compatibility_date = "2025-06-01"

# only the game's own pages may open rooms; local test servers are allowed too
[vars]
ALLOWED_ORIGINS = "https://glockkitty.pages.dev,*.glockkitty.pages.dev,http://localhost:8788,http://127.0.0.1:8765"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed class, so it runs on the Workers Free plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
